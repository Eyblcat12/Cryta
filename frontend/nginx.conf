map $request_uri $crypta_referrer_policy {
  default strict-origin-when-cross-origin;
  ~^/account/ no-referrer;
}

map $request_method $crypta_method {
  default OTHER;
  GET GET;
  HEAD HEAD;
  POST POST;
  PUT PUT;
  PATCH PATCH;
  DELETE DELETE;
  OPTIONS OPTIONS;
}

map $uri $crypta_surface {
  default web;
  ~^/api/ api;
}

map $upstream_http_x_request_id $crypta_correlation_id {
  default "-";
  "~^req_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $upstream_http_x_request_id;
}

log_format crypta_request escape=json
  '{"event":"nginx.access","time":"$time_iso8601","proxyRequestId":"$request_id",'
  '"correlationId":"$crypta_correlation_id","method":"$crypta_method","surface":"$crypta_surface",'
  '"status":"$status","upstreamStatus":"$upstream_status","requestTimeSeconds":"$request_time"}';

upstream crypta_api {
  zone crypta_api 64k;
  resolver 127.0.0.11 valid=5s;
  resolver_timeout 2s;
  server backend:3000 resolve;
}

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log crypta_request;
  # Request-time error messages can contain the raw request target and referrer.
  # Use the safe access record for these failures and keep main-scope startup logs.
  error_log /dev/null;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://crypta_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # The build also contains /assets/ for JS and CSS. Treat /assets as an SPA
  # route, not as that directory, so direct links and refresh keep APP_PORT.
  location = /assets { try_files /index.html =404; }
  location = /assets/ { try_files /index.html =404; }
  # Serve files at the public root and in the build asset directory as files.
  # A stale chunk URL must return 404 while extensionless asset details use the SPA.
  location ~ ^/(?:assets/.*|[^/]+)\.[^/]+$ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy $crypta_referrer_policy always;
  add_header X-Frame-Options DENY always;
}
