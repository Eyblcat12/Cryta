map $request_uri $crypta_referrer_policy {
  default strict-origin-when-cross-origin;
  ~^/account/ no-referrer;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # The build also contains /assets/ for JS and CSS. Treat /assets as an SPA
  # route, not as that directory, so direct links and refresh keep APP_PORT.
  location = /assets { try_files /index.html =404; }
  location = /assets/ { try_files /index.html =404; }
  # Serve files at the public root and in the build asset directory as files.
  # A stale chunk URL must return 404 while extensionless asset details use the SPA.
  location ~ ^/(?:assets/.*|[^/]+)\.[^/]+$ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy $crypta_referrer_policy always;
  add_header X-Frame-Options DENY always;
}
