services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crypta_t30_test
      POSTGRES_USER: crypta_t30_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    volumes:
      - test_postgres:/var/lib/postgresql/data
      - ../../database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypta_t30_test -d crypta_t30_test"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ../../backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://crypta_t30_test:${POSTGRES_PASSWORD}@postgres:5432/crypta_t30_test
      DATABASE_MIGRATION_MODE: ${T30_TEST_MIGRATION_MODE:-apply}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Test JWT secret required}
      JWT_ACCESS_TTL: ${T30_TEST_ACCESS_TTL:-15m}
      MFA_REQUIRED: ${T30_TEST_MFA_REQUIRED:-false}
      MFA_ENCRYPTION_KEY: ${T30_TEST_MFA_KEY:-}
      CORS_ORIGIN: http://127.0.0.1:${T30_TEST_PORT:-18080}
      COOKIE_SECURE: "false"
      OPERATIONS_MONITOR_TOKEN_SHA256: ${T30_TEST_MONITOR_TOKEN_SHA256:-}
      SMTP_ENABLED: "false"
      APP_URL: http://127.0.0.1:${T30_TEST_PORT}
      APP_TIME_ZONE: Asia/Ho_Chi_Minh
      CRYPTO_PROVIDER_MODE: MOCK
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ../../frontend
    ports: ["127.0.0.1:${T30_TEST_PORT:-18080}:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  test_postgres:
